# ─── General ─────────────────────────────────────────────────────────────────

# Enable mouse support (scroll, select panes/windows, resize by drag)
set -g mouse on

# start pane/window numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# renumber windows sequentially when one is closed (keeps 1..N contiguous)
set -g renumber-windows on

# larger scrollback buffer
set -g history-limit 10000

# truecolor: assume a 256-color terminal, tell tmux the outer term supports RGB
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,ghostty:RGB"

# use vi keys in copy mode
setw -g mode-keys vi

# ─── Keybindings ─────────────────────────────────────────────────────────────

# more intuitive pane splits (open in the current pane's directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# reload config without restarting tmux
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ─── Plugins (TPM) ───────────────────────────────────────────────────────────
# Install/update: prefix + I  ·  update: prefix + U  ·  remove unlisted: prefix + alt+u

set -g @plugin 'tmux-plugins/tpm'              # plugin manager itself
set -g @plugin 'tmux-plugins/tmux-sensible'    # widely-agreed sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'        # copy to the system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # automatic, periodic resurrect saves

# restore the last saved environment automatically when tmux starts
set -g @continuum-restore 'on'

# Auto-bootstrap TPM on first launch so a fresh machine self-heals.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Keep this line last — it initializes TPM and sources all plugins above.
run '~/.config/tmux/plugins/tpm/tpm'
