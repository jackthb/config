# Enable mouse support (scroll, select panes/windows, resize by drag)
set -g mouse on

# more intuitive pane splits
bind | split-window -h
bind - split-window -v

# start pane/window numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# larger scrollback buffer
set -g history-limit 10000
