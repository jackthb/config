id = "local.task-labels"
name = "Task and directory labels"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Show the active terminal task and working directory in Herdr's sidebar."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "sync.py"]

[[actions]]
id = "refresh"
title = "Refresh task and directory labels"
contexts = ["workspace"]
command = ["python3", "sync.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "sync.py"]

[[events]]
on = "pane.created"
command = ["python3", "sync.py"]

[[events]]
on = "pane.closed"
command = ["python3", "sync.py"]

[[events]]
on = "pane.moved"
command = ["python3", "sync.py"]

[[events]]
on = "pane.focused"
command = ["python3", "sync.py"]

[[events]]
on = "tab.focused"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.focused"
command = ["python3", "sync.py"]

[[events]]
on = "workspace.updated"
command = ["python3", "sync.py"]
