onboarding = false

[theme]
name = "gruvbox"
auto_switch = true
dark_name = "gruvbox"
light_name = "gruvbox-light"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[ui]
agent_panel_sort = "priority"
sidebar_width = 44
sidebar_max_width = 56
show_agent_labels_on_pane_borders = true
copy_on_select = true
mouse_capture = true
host_cursor = "auto"
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = false
pane_borders = true
pane_gaps = true
hide_tab_bar_when_single_tab = true
window_title = "{terminal_title} · {workspace} · {hostname}"

# Codex already supplies a conversation title through the terminal title.
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true, dim = false }],
  ["agent", "tab"],
  ["$directory"],
]

# The local task-labels plugin supplies these from live pane metadata.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$task", bold = true, dim = false }],
  ["$directory"],
  ["branch", "git_status"],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[session]
resume_agents_on_restore = true

[experimental]
# Restore recent terminal contents after WSL or the Herdr server restarts.
pane_history = true

[remote]
manage_ssh_config = true

[server]
headless_cols = 120
headless_rows = 40

[advanced]
scrollback_limit_bytes = 10000000
